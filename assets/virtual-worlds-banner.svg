<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#08071a" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyberCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .bg-grid {
      stroke: #334155;
      stroke-width: 0.75;
      stroke-opacity: 0.25;
    }
    .floating-shape-1 {
      animation: floatSlow 8s ease-in-out infinite alternate;
    }
    .floating-shape-2 {
      animation: floatReverse 10s ease-in-out infinite alternate;
    }
    .pulse-glow {
      animation: pulse 4s ease-in-out infinite alternate;
    }
    .grid-horizon {
      animation: gridDrift 20s linear infinite;
    }
    .pillar-light {
      animation: lightShimmer 5s ease-in-out infinite alternate;
    }
    .orbit-node {
      animation: orbitRotate 14s linear infinite;
      transform-origin: 1040px 180px;
    }

    @keyframes floatSlow {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-16px) rotate(4deg); }
    }
    @keyframes floatReverse {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(14px) rotate(-3deg); }
    }
    @keyframes pulse {
      0% { opacity: 0.35; transform: scale(0.98); }
      100% { opacity: 0.8; transform: scale(1.02); }
    }
    @keyframes lightShimmer {
      0% { opacity: 0.25; }
      100% { opacity: 0.7; }
    }
    @keyframes orbitRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <!-- Deep Virtual Universe Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Dynamic Cyber Grid Perspective (Horizon) -->
  <g opacity="0.45" class="floating-shape-1">
    <!-- Perspective Floor Lines -->
    <line x1="600" y1="230" x2="0" y2="400" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.4" />
    <line x1="600" y1="230" x2="180" y2="400" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.4" />
    <line x1="600" y1="230" x2="380" y2="400" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5" />
    <line x1="600" y1="230" x2="600" y2="400" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" />
    <line x1="600" y1="230" x2="820" y2="400" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5" />
    <line x1="600" y1="230" x2="1020" y2="400" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.4" />
    <line x1="600" y1="230" x2="1200" y2="400" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.4" />

    <!-- Latitudinal Curved Grid Lines -->
    <ellipse cx="600" cy="270" rx="320" ry="15" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />
    <ellipse cx="600" cy="315" rx="480" ry="25" fill="none" stroke="#6366f1" stroke-width="1" stroke-opacity="0.35" />
    <ellipse cx="600" cy="370" rx="640" ry="40" fill="none" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.4" />
  </g>

  <!-- Ambient Light Orbs (Background Glows) -->
  <circle cx="180" cy="110" r="140" fill="#38bdf8" opacity="0.12" filter="url(#neonGlow)" class="pulse-glow" />
  <circle cx="1020" cy="280" r="160" fill="#c084fc" opacity="0.15" filter="url(#neonGlow)" class="pulse-glow" />
  <circle cx="600" cy="70" r="120" fill="#6366f1" opacity="0.12" filter="url(#neonGlow)" />

  <!-- Animated Virtual World Geometric Elements (Left Side: Isometric Cyber Tower) -->
  <g class="floating-shape-1" opacity="0.75">
    <!-- Isometric Cube 1 -->
    <polygon points="110,180 155,155 200,180 155,205" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <polygon points="110,180 155,205 155,255 110,230" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <polygon points="155,205 200,180 200,230 155,255" fill="#334155" stroke="#38bdf8" stroke-width="1.5" />

    <!-- Isometric Floating Mini Cube -->
    <polygon points="80,120 110,105 140,120 110,135" fill="#38bdf8" fill-opacity="0.4" stroke="#7dd3fc" stroke-width="1.2" />
    <polygon points="80,120 110,135 110,165 80,150" fill="#0284c7" fill-opacity="0.5" stroke="#7dd3fc" stroke-width="1.2" />
    <polygon points="110,135 140,120 140,150 110,165" fill="#0369a1" fill-opacity="0.6" stroke="#7dd3fc" stroke-width="1.2" />

    <!-- Connecting Beam -->
    <line x1="155" y1="155" x2="110" y2="135" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7" />
  </g>

  <!-- Animated Virtual World Elements (Right Side: Spatial Node & Orbit Rings) -->
  <g class="floating-shape-2">
    <!-- Outer Orbit Ring -->
    <ellipse cx="1040" cy="180" rx="110" ry="65" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6" />
    <!-- Inner Orbit Ring -->
    <ellipse cx="1040" cy="180" rx="75" ry="40" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.7" />

    <!-- Central Metaverse Core Sphere -->
    <circle cx="1040" cy="180" r="32" fill="url(#primaryGlow)" opacity="0.85" filter="url(#neonGlow)" />
    <circle cx="1030" cy="170" r="8" fill="#ffffff" opacity="0.6" />

    <!-- Orbiting Satellites -->
    <g class="orbit-node">
      <circle cx="1150" cy="180" r="8" fill="#38bdf8" filter="url(#neonGlow)" />
      <circle cx="930" cy="180" r="6" fill="#f43f5e" filter="url(#neonGlow)" />
    </g>
  </g>

  <!-- High-Tech Feature Badge Cards (Flanking) -->
  <g transform="translate(60, 290)" class="floating-shape-2">
    <rect width="170" height="42" rx="21" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="22" cy="21" r="7" fill="#38bdf8" />
    <text x="38" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" letter-spacing="0.5">🌐 WebXR &amp; 3D</text>
  </g>

  <g transform="translate(970, 290)" class="floating-shape-1">
    <rect width="170" height="42" rx="21" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="22" cy="21" r="7" fill="#c084fc" />
    <text x="38" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" letter-spacing="0.5">🎮 Self-Hosted Grids</text>
  </g>

  <!-- Central Foreground Content (Title, Subtitle & Ecosystem Tagline) - ALWAYS IN FOREGROUND -->
  <!-- Top Category Chip -->
  <g transform="translate(450, 48)">
    <rect width="300" height="30" rx="15" fill="#1e1b4b" fill-opacity="0.85" stroke="#6366f1" stroke-width="1.2" />
    <text x="150" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#a5b4fc" letter-spacing="1.5">AWESOME CURATED ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="142" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    Virtual Worlds &amp; Community Servers
  </text>

  <!-- Title Gradient Accent Bar -->
  <rect x="360" y="162" width="480" height="4" rx="2" fill="url(#primaryGlow)" />

  <!-- Subtitle -->
  <text x="600" y="202" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#94a3b8" letter-spacing="0.2">
    Social VR Platforms • Open Metaverse Grids • WebXR Multiplayer • Isometric Spaces
  </text>

  <!-- Architecture Capabilities Pills -->
  <g transform="translate(270, 230)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="145" height="32" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    <text x="72" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#38bdf8">⚡ OpenSimulator</text>

    <!-- Pill 2 -->
    <rect x="160" y="0" width="165" height="32" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    <text x="242" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#818cf8">🕶️ Social VR / VRChat</text>

    <!-- Pill 3 -->
    <rect x="340" y="0" width="155" height="32" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    <text x="417" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#c084fc">🏰 Isometric Habbo</text>

    <!-- Pill 4 -->
    <rect x="510" y="0" width="150" height="32" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    <text x="585" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#34d399">🚀 WebGL &amp; Nakama</text>
  </g>
</svg>
